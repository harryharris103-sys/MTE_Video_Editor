<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTE Video Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1A1A1A">
<style>
:root{--gold:#C9932E;--bg:#FFFFFF;--fg:#1A1A1A;--mut:#666666;--panel:#F5F3EE;--bd:#0002}
:root[data-theme=dark]{--bg:#111111;--fg:#EDEDED;--mut:#9a9a9a;--panel:#1c1c1c;--bd:#fff2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#1A1A1A;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:1.15rem}header h1 span{color:var(--gold)}
header small{color:#bbb;flex:1}
main{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px}
canvas{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:8px;display:block}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
.bar input[type=range]{flex:1}
button,select,input{font:inherit;color:var(--fg)}
button{padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:transparent;cursor:pointer}
button.p{background:var(--gold);border-color:var(--gold);color:#1A1A1A;font-weight:700}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px;width:100%}
input[type=range],input[type=checkbox],input[type=color]{padding:0;width:auto}
input[type=range]{width:100%}
label{display:block;font-size:.75rem;font-weight:700;margin:8px 0 3px;color:var(--mut)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{border-bottom:1px solid var(--bd);padding:6px 0}
summary{cursor:pointer;font-weight:700;padding:6px 0}
#msg{font-size:.8rem;color:var(--gold);min-height:1.2em;margin-top:6px}
#tlist{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>MTE <span>Video Editor</span></h1><small>Music · Lower thirds · Social exports</small><button id="theme" title="Dark / normal mode">🌓</button></header>
<main>
<section class="card">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div class="bar"><button id="pp">▶</button><input type="range" id="sk" min="0" max="1" step="0.01" value="0"><span id="tm">0:00</span></div>
  <div id="msg"></div>
</section>
<aside class="card">
<details open><summary>1 · Media</summary>
  <label>Video (from this device)</label><input type="file" id="vf" accept="video/*">
  <label>Music clip</label><input type="file" id="mf" accept="audio/*">
  <div class="r2"><div><label>Video volume</label><input type="range" data-g="vVol" min="0" max="1" step="0.05"></div>
  <div><label>Music volume</label><input type="range" data-g="mVol" min="0" max="1" step="0.05"></div></div>
  <div class="r2"><div><label>Music starts at (sec in clip)</label><input type="number" data-g="mStart" min="0" step="0.5"></div>
  <div><label>Loop music</label><input type="checkbox" data-g="mLoop"></div></div>
</details>
<details open><summary>2 · Lower thirds</summary>
  <div class="bar"><select id="ltSel"></select><button id="ltAdd">＋</button><button id="ltDel">🗑</button></div>
  <label>Kicker line</label><input data-l="kicker">
  <label>Main line</label><input data-l="main">
  <label>Secondary line</label><input data-l="sub">
  <div class="r2"><div><label>Start (sec)</label><input type="number" data-l="start" min="0" step="0.5"></div>
  <div><label>Duration (sec)</label><input type="number" data-l="dur" min="1" step="0.5"></div></div>
  <div class="r2"><div><label>Transition</label><select data-l="trans"><option value="slide">Slide</option><option value="fade">Fade</option><option value="rise">Rise</option><option value="wipe">Wipe</option><option value="zoom">Zoom</option><option value="none">None</option></select></div>
  <div><label>Position</label><select data-l="pos"><option value="bl">Bottom left</option><option value="safe">Shorts-safe (higher)</option><option value="top">Top left</option></select></div></div>
  <div class="r2"><div><label>Font</label><select data-l="font" id="fontSel"></select></div>
  <div><label>Accent</label><input type="color" data-l="accent"></div></div>
</details>
<details><summary>3 · Fonts</summary>
  <label>Import font (.ttf .otf .woff .woff2)</label><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" multiple>
</details>
<details><summary>4 · Templates</summary>
  <div class="bar"><input id="tn" placeholder="Template name"><button id="ts">Save</button></div>
  <div id="tlist"></div>
  <div class="bar"><button id="te">Export file</button><button id="ti">Import file</button><input type="file" id="tif" accept=".json" hidden></div>
</details>
<details open><summary>5 · Export</summary>
  <label>Platform / size</label><select data-g="size" id="sz"></select>
  <div class="r2"><div><label>Fit</label><select data-g="fit"><option value="cover">Fill (crop)</option><option value="contain">Fit (bars)</option></select></div>
  <div><label>Quality</label><select data-g="q" data-n><option value="1">Full</option><option value="0.75">75%</option><option value="0.5">50%</option></select></div></div>
  <label>Format</label><select data-g="fmt"><option value="auto">Best (MP4 if supported)</option><option value="mp4">MP4</option><option value="webm">WebM</option><option value="gif">GIF (silent, ≤30s)</option></select>
  <button class="p" id="ex" style="width:100%;margin-top:10px">Export video</button>
  <p style="font-size:.72rem;color:var(--mut)">Exports render in real time — keep this tab open and visible until it finishes.</p>
</details>
</aside>
</main>
<video id="vid" playsinline preload="auto" style="display:none"></video>
<audio id="mus" preload="auto" style="display:none"></audio>
<script>
const $=id=>document.getElementById(id);
const SIZES={yt:['YouTube – main (16:9)',1920,1080],yts:['YouTube Shorts (9:16)',1080,1920],fb:['Facebook – main post (16:9)',1280,720],fbsq:['Facebook – square post (1:1)',1080,1080],fbs:['Facebook – Shorts/Reels (9:16)',1080,1920],tt:['TikTok (9:16)',1080,1920],x:['X / Twitter (16:9)',1280,720],xsq:['X / Twitter square (1:1)',1080,1080],ig:['Instagram feed (4:5)',1080,1350],igr:['Instagram Reels (9:16)',1080,1920],wa:['WhatsApp Status (9:16)',720,1280]};
const newLT=()=>({kicker:'Word ministration by',main:'Pastor John Mensah',sub:'Sunday Service',start:1,dur:5,accent:'#C9932E',font:'Arial',trans:'slide',pos:'bl'});
let S={size:'yt',fit:'cover',q:1,fmt:'auto',vVol:1,mVol:0.8,mStart:0,mLoop:true,lts:[newLT()],sel:0};
const cv=$('cv'),cx=cv.getContext('2d'),vid=$('vid'),mus=$('mus');
const msg=t=>$('msg').textContent=t||'';
const fonts=['Arial','Helvetica','Georgia','Times New Roman','Verdana'];

/* ---------- theme ---------- */
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('mte.theme',t)};
setTheme(localStorage.getItem('mte.theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');

/* ---------- audio graph ---------- */
let ac,dest,outG,vG,mG;
function ensureAudio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();dest=ac.createMediaStreamDestination();outG=ac.createGain();outG.connect(ac.destination);
    vG=ac.createGain();mG=ac.createGain();[vG,mG].forEach(g=>{g.connect(outG);g.connect(dest)});
    ac.createMediaElementSource(vid).connect(vG);ac.createMediaElementSource(mus).connect(mG);}
  ac.resume();
}

/* ---------- media loading ---------- */
$('vf').onchange=e=>{const f=e.target.files[0];if(!f)return;ensureAudio();vid.src=URL.createObjectURL(f);vid.onloadedmetadata=()=>{$('sk').max=vid.duration;vid.currentTime=0.01;msg('Video loaded: '+f.name)}};
$('mf').onchange=e=>{const f=e.target.files[0];if(!f)return;ensureAudio();mus.src=URL.createObjectURL(f);msg('Music loaded: '+f.name)};
const syncMus=()=>{if(mus.src){mus.currentTime=S.mStart+vid.currentTime}};
vid.onplay=()=>{if(mus.src){syncMus();mus.play()}$('pp').textContent='⏸'};
vid.onpause=()=>{mus.pause();$('pp').textContent='▶'};
vid.onseeked=()=>{if(!vid.paused)syncMus()};
$('pp').onclick=()=>{if(!vid.src)return;ensureAudio();vid.paused?vid.play():vid.pause()};
$('sk').oninput=e=>{vid.currentTime=+e.target.value};

/* ---------- drawing ---------- */
const hex=(h,m)=>{const n=parseInt(h.slice(1),16);return'rgb('+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(255-v)*m)).join(',')+')'};
function drawLT(c,W,H,t,L){
  const a=t-L.start,b=L.start+L.dur-t;if(a<0||b<0)return;
  const p=Math.min(1,Math.min(a,b)/0.6),e=L.trans=='none'?1:1-Math.pow(1-p,3),u=Math.min(W,H)/720;
  const F=(w,px,it)=>`${it?'italic ':''}${w} ${px*u}px "${L.font}",Arial,sans-serif`;
  const rows=[[L.kicker,F(400,20,1),hex(L.accent,.4),28],[L.main,F(700,34),'#F8F5EC',42],[L.sub,F(400,17),'#C7CBE0',26]].filter(r=>r[0]);
  if(!rows.length)return;
  let w=0,h=28*u;rows.forEach(r=>{c.font=r[1];w=Math.max(w,c.measureText(r[0]).width);h+=r[3]*u});
  w+=54*u;w=Math.min(w,W*.9);
  const x=W*.05,y=(L.pos=='safe'?H*.72:L.pos=='top'?H*.09+h:H*.91)-h;
  c.save();
  if(L.trans=='fade')c.globalAlpha=e;
  else if(L.trans=='slide')c.translate(-(1-e)*(x+w+20),0);
  else if(L.trans=='rise'){c.translate(0,(1-e)*50*u);c.globalAlpha=e}
  else if(L.trans=='wipe'){c.beginPath();c.rect(x-5,y-5,(w+10)*e,h+10);c.clip()}
  else if(L.trans=='zoom'){const s=.7+.3*e;c.translate(x,y+h);c.scale(s,s);c.translate(-x,-(y+h));c.globalAlpha=e}
  const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'rgba(18,22,42,.92)');g.addColorStop(.85,'rgba(18,22,42,.7)');g.addColorStop(1,'rgba(18,22,42,0)');
  c.fillStyle=g;c.fillRect(x,y,w,h);c.fillStyle=L.accent;c.fillRect(x,y,4*u,h);
  let ty=y+14*u;c.textBaseline='top';
  rows.forEach(r=>{c.font=r[1];c.fillStyle=r[2];c.fillText(r[0],x+22*u,ty+3*u,w-30*u);ty+=r[3]*u});
  c.restore();
}
function draw(c,W,H,t){
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  const vw=vid.videoWidth,vh=vid.videoHeight;
  if(vw){const s=(S.fit=='cover'?Math.max:Math.min)(W/vw,H/vh);c.drawImage(vid,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s)}
  else{c.fillStyle='#666';c.font=`${H/20}px Arial`;c.textAlign='center';c.textBaseline='middle';c.fillText('Load a video to begin',W/2,H/2);c.textAlign='left'}
  S.lts.forEach(L=>drawLT(c,W,H,t,L));
}
const dims=()=>{const z=SIZES[S.size]||SIZES.yt;return[Math.round(z[1]*S.q/2)*2,Math.round(z[2]*S.q/2)*2]};
function loop(){
  const[w,h]=dims();if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}
  if(vG){vG.gain.value=S.vVol;mG.gain.value=S.mVol}mus.loop=S.mLoop;
  draw(cx,w,h,vid.currentTime||0);
  const t=vid.currentTime||0;$('sk').value=t;$('tm').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  requestAnimationFrame(loop);
}

/* ---------- UI binding ---------- */
$('sz').innerHTML=Object.entries(SIZES).map(([k,v])=>`<option value="${k}">${v[0]} · ${v[1]}×${v[2]}</option>`).join('');
function fontOpts(){$('fontSel').innerHTML=fonts.map(f=>`<option>${f}</option>`).join('')}
function sync(){
  fontOpts();
  document.querySelectorAll('[data-g]').forEach(e=>{const v=S[e.dataset.g];e.type=='checkbox'?e.checked=v:e.value=v});
  const L=S.lts[S.sel];document.querySelectorAll('[data-l]').forEach(e=>e.value=L[e.dataset.l]);
  $('ltSel').innerHTML=S.lts.map((l,i)=>`<option value="${i}">${i+1}. ${l.main||'(empty)'}</option>`).join('');$('ltSel').value=S.sel;
  tlist();
}
document.addEventListener('input',e=>{
  const t=e.target,g=t.dataset.g,l=t.dataset.l;
  if(g){S[g]=t.type=='checkbox'?t.checked:(['number','range'].includes(t.type)||t.dataset.n!==undefined)?+t.value:t.value;if(g=='mStart'&&!vid.paused)syncMus()}
  if(l){S.lts[S.sel][l]=t.type=='number'?+t.value:t.value;if(l=='main'){const o=$('ltSel').options[S.sel];if(o)o.textContent=(S.sel+1)+'. '+t.value}}
});
$('ltSel').onchange=e=>{S.sel=+e.target.value;sync()};
$('ltAdd').onclick=()=>{const n=newLT();n.start=Math.round((vid.currentTime||0)*2)/2;S.lts.push(n);S.sel=S.lts.length-1;sync()};
$('ltDel').onclick=()=>{if(S.lts.length>1){S.lts.splice(S.sel,1);S.sel=0;sync()}};

/* ---------- fonts (stored on this device) ---------- */
const db=new Promise(r=>{const q=indexedDB.open('mte',1);q.onupgradeneeded=()=>q.result.createObjectStore('fonts');q.onsuccess=()=>r(q.result)});
const idb=async(m,...a)=>{const d=await db;return new Promise(r=>{const s=d.transaction('fonts',m.startsWith('get')?'readonly':'readwrite').objectStore('fonts');const q=s[m](...a);q.onsuccess=()=>r(q.result)})};
async function addFont(name,buf){const f=new FontFace(name,buf);await f.load();document.fonts.add(f);if(!fonts.includes(name))fonts.push(name)}
$('ff').onchange=async e=>{for(const f of e.target.files){try{const name=f.name.replace(/\.[^.]+$/,'');const buf=await f.arrayBuffer();await addFont(name,buf.slice(0));await idb('put',buf,name);S.lts[S.sel].font=name;msg('Font added: '+name)}catch(x){msg('Could not load font '+f.name)}}sync()};

/* ---------- templates ---------- */
const TK='mte.templates';const tpls=()=>JSON.parse(localStorage.getItem(TK)||'{}');
function tlist(){$('tlist').innerHTML='';Object.keys(tpls()).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>applyTpl(tpls()[n]);const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{const t=tpls();delete t[n];localStorage.setItem(TK,JSON.stringify(t));tlist()};$('tlist').append(b,x)})}
function applyTpl(t){S=Object.assign({},S,t,{sel:0});sync();msg('Template applied')}
$('ts').onclick=()=>{const n=$('tn').value.trim();if(!n)return msg('Name your template first');const t=tpls();t[n]=JSON.parse(JSON.stringify(S));localStorage.setItem(TK,JSON.stringify(t));tlist();msg('Template saved')};
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()};
$('te').onclick=()=>dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'mte-template.json');
$('ti').onclick=()=>$('tif').click();
$('tif').onchange=async e=>{try{applyTpl(JSON.parse(await e.target.files[0].text()))}catch(x){msg('Invalid template file')}};

/* ---------- export ---------- */
const seek=t=>new Promise(r=>{vid.onseeked=()=>{vid.onseeked=null;r()};vid.currentTime=t});
async function doExport(){
  if(!vid.src)return msg('Load a video first');
  ensureAudio();vid.pause();const[w,h]=dims();
  if(S.fmt=='gif')return exportGif();
  const pref={mp4:['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'],webm:['video/webm;codecs=vp9,opus','video/webm']};
  const list=S.fmt=='auto'?[...pref.mp4,...pref.webm]:pref[S.fmt];
  const mime=list.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)return msg('This browser cannot record that format. Try WebM, or use Chrome/Edge.');
  const stream=cv.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.round(8e6*S.q)}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{outG.gain.value=1;mus.pause();dl(new Blob(chunks,{type:mime}),`mte-${S.size}.${mime.includes('mp4')?'mp4':'webm'}`);msg('Export complete ✔');$('ex').disabled=false};
  await seek(0);outG.gain.value=0;$('ex').disabled=true;msg('Exporting… keep this tab open');
  if(mus.src){syncMus()}rec.start(1000);vid.onended=()=>{vid.onended=null;setTimeout(()=>rec.stop(),300)};
  vid.play();
}
async function exportGif(){
  const d=Math.min(vid.duration,30),gw=Math.min(480,dims()[0]),gh=Math.round(gw*dims()[1]/dims()[0]/2)*2;
  const oc=document.createElement('canvas');oc.width=gw;oc.height=gh;const c=oc.getContext('2d',{willReadFrequently:true}),frames=[];
  $('ex').disabled=true;
  for(let t=0;t<d;t+=0.1){await seek(t);draw(c,gw,gh,t);const px=c.getImageData(0,0,gw,gh).data,ix=new Uint8Array(gw*gh);
    for(let i=0;i<ix.length;i++)ix[i]=Math.round(px[i*4]/51)*36+Math.round(px[i*4+1]/51)*6+Math.round(px[i*4+2]/51);
    frames.push(ix);msg(`Rendering GIF ${Math.round(t/d*100)}%`)}
  dl(new Blob([makeGif(frames,gw,gh,10)],{type:'image/gif'}),`mte-${S.size}.gif`);msg('GIF ready ✔');$('ex').disabled=false;
}
function makeGif(frames,w,h,delay){
  const o=[],b=(...a)=>a.forEach(v=>o.push(v)),s=v=>b(v&255,v>>8),str=x=>[...x].forEach(ch=>b(ch.charCodeAt(0)));
  str('GIF89a');s(w);s(h);b(0xF7,0,0);
  for(let i=0;i<256;i++)i<216?b(Math.floor(i/36)*51,Math.floor(i/6)%6*51,i%6*51):b(0,0,0);
  b(0x21,0xFF,11);str('NETSCAPE2.0');b(3,1,0,0,0);
  for(const f of frames){
    b(0x21,0xF9,4,4);s(delay);b(0,0,0x2C);s(0);s(0);s(w);s(h);b(0,8);
    const bytes=[];let bits=0,nb=0,size=9,next=258,dict=new Map();
    const emit=c=>{bits|=c<<nb;nb+=size;while(nb>=8){bytes.push(bits&255);bits>>=8;nb-=8}};
    emit(256);let cur=f[0];
    for(let i=1;i<f.length;i++){const k=cur*256+f[i];
      if(dict.has(k))cur=dict.get(k);
      else{emit(cur);if(next<4096){dict.set(k,next++);if(next>(1<<size)&&size<12)size++}else{emit(256);dict.clear();next=258;size=9}cur=f[i]}}
    emit(cur);emit(257);if(nb>0)bytes.push(bits&255);
    for(let i=0;i<bytes.length;i+=255){const n=Math.min(255,bytes.length-i);o.push(n);for(let j=0;j<n;j++)o.push(bytes[i+j])}
    o.push(0);
  }
  b(0x3B);return new Uint8Array(o);
}
$('ex').onclick=doExport;

/* ---------- init ---------- */
(async()=>{
  try{const keys=await idb('getAllKeys');for(const k of keys){await addFont(k,await idb('get',k))}}catch(x){}
  sync();loop();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
